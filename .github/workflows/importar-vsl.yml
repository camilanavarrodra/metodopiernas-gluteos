name: Importar VSL definitiva da Camila
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/importar-vsl.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transferir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
      - name: Baixar vídeo da conta HeyGen
        env:
          HEYGEN_VIDEO_URL: 'https://files2.heygen.ai/aws_pacific/avatar_tmp/8a85200e09a3494a9c796a4a4a1f76d9/330338ebfde711a185b5577f83c6c7b6.mp4?Expires=1792765271&Signature=QZBRHv5p96NsGVaS7pUUOFEhQSJ1NLrjwRzy7y6slAD-318Ia7jDJenPr2pJDbaSJ1OzHFF-Qha2Gi8uquoF~X0T0w6QDforkctQ8OYrPZR65-kND5-iLcd6relFC7xovdsdxxFrAcyTw8H7UlFnp200LYvz~lOTGFH0Hs0ugyHlETcOrgj0RgDKbX-naMIHatZm1r-bvD3XVz1aulhOWPx9bHga452yUX2NlNaLbcqZPRTDxDs7~sh7eR4AR5fDhbwB8Eh13ZMfRhEoHu7j9NT3lPvQWA-NinkZKhMK8WV6tRpgzzz4UBaTlUoC9MYAyML6iAmlKZcaIMoCOF8B0w__&Key-Pair-Id=K38HBHX5LX3X2H'
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 --silent --show-error \
            --output assets/vsl-camila-final.mp4 "$HEYGEN_VIDEO_URL"
          SIZE="$(stat -c%s assets/vsl-camila-final.mp4)"
          test "$SIZE" -gt 1000000
          test "$SIZE" -lt 95000000
          file assets/vsl-camila-final.mp4
          file assets/vsl-camila-final.mp4 | grep -E 'ISO Media|MPEG-4|MP4'
      - name: Publicar o MP4 no próprio repositório
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/vsl-camila-final.mp4
          git diff --cached --quiet || git commit -m 'Add Camila HeyGen VSL MP4 to site'
          git push
